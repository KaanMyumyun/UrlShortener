name: Deploy to Azure

on:
  workflow_run:
    workflows: ["Docker Image CI"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd ~/app

            # pull latest backend image
            sudo docker pull kstkaan/url-backend:latest

            # stop + remove the old backend container 
            sudo docker-compose stop backend || true
            sudo docker-compose rm -f backend || true

            # recreate using the new image
            sudo docker-compose up -d backend --force-recreate

            # pull latest frontend image
            sudo docker pull kstkaan/url-frontend:latest

            # stop + remove the old frontend container 
            sudo docker-compose stop frontend || true
            sudo docker-compose rm -f frontend || true

            # recreate using the new image
            sudo docker-compose up -d frontend --force-recreate

            sudo docker image prune -f
            echo "Deploy complete for SHA: $IMAGE_TAG"