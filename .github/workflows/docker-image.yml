name: Docker Image CI

on:
  workflow_run:
    workflows: [".NET"]
    types:
      - completed

jobs:
  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact upstream commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: |
          docker build --no-cache -f URLShortner/Dockerfile \
            -t kstkaan/url-backend:latest \
            -t kstkaan/url-backend:${IMAGE_TAG} \
            .

      - name: Push backend image
        run: |
          docker push kstkaan/url-backend:latest
          docker push kstkaan/url-backend:${IMAGE_TAG}

      - name: Build frontend image
        run: |
          docker build --no-cache \
            -f front-end/Dockerfile \
            -t kstkaan/url-frontend:latest \
            -t kstkaan/url-frontend:${IMAGE_TAG} \
            ./front-end

      - name: Push frontend image
        run: |
          docker push kstkaan/url-frontend:latest
          docker push kstkaan/url-frontend:${IMAGE_TAG}